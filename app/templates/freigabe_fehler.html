<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freigabe-Link</title>
  <style>
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#f0f0f0; color:#2D2D2D; }
    .wrap { max-width:520px; margin:60px auto; background:#fff; border-radius:10px; overflow:hidden; }
    .head { background:#2D2D2D; color:#fff; padding:22px 28px; border-bottom:4px solid #E8930A; }
    .logo { display:inline-block; border:2px solid #E8930A; color:#E8930A; font-weight:700; letter-spacing:1px; padding:4px 9px; border-radius:4px; }
    .body { padding:34px 28px; text-align:center; }
    h1 { font-size:20px; }
    p { color:#555; }
    .foot { padding:18px 28px; color:#999; font-size:12px; border-top:1px solid #eee; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head"><span class="logo">ABE</span></div>
    <div class="body">
      <h1>Freigabe nicht möglich</h1>
      <p>{{ grund }}</p>
      <p class="meta">Bitte wenden Sie sich an Ihre Ansprechpartnerin bei {{ einstellungen.FIRMA }}.</p>
    </div>
    <div class="foot">{{ einstellungen.FIRMA }} · {{ einstellungen.APP_NAME }}</div>
  </div>
</body>
</html>
